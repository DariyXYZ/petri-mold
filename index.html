<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mold.log</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<button id="sound-toggle" aria-label="Sound" aria-pressed="true" title="Turn sound off">SOUND ON</button>
<button id="save" title="Export PNG (S)">PNG</button>
<canvas id="fire-overlay" aria-hidden="true"></canvas>

<header id="status">
  <div id="phase">click inside the dish to place spores</div>
  <div id="species"></div>
</header>

<div id="wrap">
  <canvas id="stage"></canvas>
  <div id="bar">
    <button id="start">GROW</button>
    <button id="pause" title="P">PAUSE</button>
    <button id="reseed" title="Burn the dish clean (R)">BURN</button>
  </div>
</div>

<!-- палитра штаммов: превью-квадратики работают как кисть -->
<aside id="strains" aria-label="Strain palette">
  <h2>Strains</h2>
  <div id="brushes"></div>
  <div id="strain-info"><em>Pick a strain, then click inside the dish.</em></div>
</aside>

<script src="js/rng.js"></script>
<script src="js/palette.js"></script>
<script src="js/dish.js"></script>
<script src="js/fields.js"></script>
<script src="js/growth.js"></script>
<script src="js/scene.js"></script>
<script src="js/render.js"></script>
<script src="js/sound.js"></script>
<script src="assets/tweezers.js"></script>
<script src="js/cursor.js"></script>
<script src="js/preview.js"></script>
<script src="assets/fire-frames.js"></script>
<script src="js/burn.js"></script>
<script src="js/skin.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
