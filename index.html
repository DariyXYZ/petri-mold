<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mold.log</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<button id="sound-toggle" aria-label="Sound" aria-pressed="true" title="Turn sound off"><svg viewBox="0 0 12 12" width="24" height="24" shape-rendering="crispEdges" aria-hidden="true"><path d="M1 4h2v4H1zM3 3h1v6H3zM4 2h1v8H4zM5 1h1v10H5z"/><g class="on"><path d="M8 4h1v4H8zM10 2h1v8h-1z"/></g><g class="off"><path d="M1 1h1v1H1zM2 2h1v1H2zM3 3h1v1H3zM4 4h1v1H4zM5 5h2v2H5zM7 7h1v1H7zM8 8h1v1H8zM9 9h1v1H9zM10 10h1v1h-1zM10 1h1v1h-1zM9 2h1v1H9zM8 3h1v1H8zM7 4h1v1H7zM4 7h1v1H4zM3 8h1v1H3zM2 9h1v1H2zM1 10h1v1H1z"/></g></svg></button>
<button id="save" title="Export PNG (S)">PNG</button>
<canvas id="fire-overlay" aria-hidden="true"></canvas>

<header id="status">
  <div id="phase">click inside the dish to place spores</div>
  <div id="species"></div>
</header>

<div id="wrap">
  <canvas id="stage"></canvas>
  <div id="bar">
    <button id="start">GROW</button>
    <button id="pause" title="P">PAUSE</button>
    <button id="reseed" title="Burn the dish clean (R)">BURN</button>
  </div>
</div>

<!-- палитра штаммов: превью-квадратики работают как кисть -->
<aside id="strains" aria-label="Strain palette">
  <h2>Strains</h2>
  <div id="brushes"></div>
  <div id="strain-info"><em>Pick a strain, then click inside the dish.</em></div>
</aside>

<script src="js/rng.js"></script>
<script src="js/palette.js"></script>
<script src="js/dish.js"></script>
<script src="js/fields.js"></script>
<script src="js/growth.js"></script>
<script src="js/scene.js"></script>
<script src="js/render.js"></script>
<script src="js/sound.js"></script>
<script src="assets/tweezers.js"></script>
<script src="js/cursor.js"></script>
<script src="js/preview.js"></script>
<script src="assets/fire-frames.js"></script>
<script src="js/burn.js"></script>
<script src="js/skin.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
